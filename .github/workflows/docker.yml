name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write # tag the commit when a new Actual version lands on main
  packages: write

concurrency:
  group: docker-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to know which release is the newest
      - id: release
        if: github.event_name == 'push'
        run: bash .github/scripts/release.sh >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/actualbudget-overview-dash
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=${{ steps.release.outputs.line }},enable=${{ steps.release.outputs.line != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
      # Tested before anything is published, and part of the build check that gates merges.
      - name: Build the image to test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: overview-dash:test
          cache-from: type=gha
      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh overview-dash:test
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Tagged only once the image is out, so a failed build is retried by the next push to main.
      # A tag pushed with GITHUB_TOKEN starts no other run, so the release isn't built twice.
      - name: Tag the release
        if: steps.release.outputs.create == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
